[workspace]
resolver = "3"
members = [
  "crates/descendit",
  "crates/descendit-ra",
  "crates/mb-tui",
  "crates/text-diagram",
]
exclude = ["crates/descendit/examples/sample-crate", "crates/descendit/examples/state-explosion"]

[workspace.package]
version = "0.0.2"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
repository = "https://github.com/owen-d/monobrown"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[workspace.dependencies]
descendit-ra = { path = "crates/descendit-ra", version = "0.0.2" }
mb-tui = { path = "crates/mb-tui", version = "0.0.2" }
text-diagram = { path = "crates/text-diagram", version = "0.1.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["std"] }
crossterm = "0.29.0"
insta = "1.43.2"
libc = "0.2.175"
pulldown-cmark = "0.10"
ratatui = "0.30.0"
regex-lite = "0.1.7"
similar = "2.7.0"
syntect = { version = "5", default-features = false, features = ["default-themes", "default-syntaxes", "regex-onig", "plist-load"] }
two-face = { version = "0.5", default-features = false, features = ["syntect-default-onig"] }
termwiz = "0.23.3"
unicode-width = "0.2"
